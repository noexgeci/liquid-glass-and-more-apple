# Publishes the demo (index.html + dist/) to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r dist _site/dist
          cp -r examples/html _site/example
          sed -i 's#\.\./\.\./dist/#../dist/#g' _site/example/index.html
          mkdir -p _site/detailing
          sed 's#\.\./\.\./dist/#../dist/#g' examples/detailing/index.html > _site/detailing/index.html
          cp -r examples/detailing/img _site/detailing/img
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
